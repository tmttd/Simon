# Simon/docker-compose.yml
services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./backend/.env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 1vCPU / 2GB 서버 최적화: PostgreSQL 리소스 제한
    environment:
      POSTGRES_INITDB_ARGS: "-c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env

    command: >
      uvicorn config.asgi:application
        --host 0.0.0.0
        --port 8000
        --workers 2
        --limit-concurrency 80
        --timeout-keep-alive 300
        --backlog 1024
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    # 1vCPU / 2GB 서버 최적화: Backend 리소스 제한
    deploy:
      resources:
        limits:
          cpus: '0.7'
          memory: 1536M
        reservations:
          cpus: '0.3'
          memory: 768M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 설정 파일 연결
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      # Let's Encrypt 인증서 파일들을 컨테이너 내부로 연결
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Let's Encrypt 갱신용 폴더 연결
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend
    restart: always
    # 1vCPU / 2GB 서버 최적화: Nginx 리소스 제한
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

volumes:
  postgres_data: